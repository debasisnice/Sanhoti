name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add host to known_hosts to avoid prompt
          ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: Could not add host to known_hosts"

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Verify secrets are set
          if [ -z "$EC2_USER" ] || [ -z "$EC2_HOST" ]; then
            echo "❌ Error: EC2_USER or EC2_HOST is not set!"
            echo "EC2_USER: '$EC2_USER'"
            echo "EC2_HOST: '$EC2_HOST'"
            echo "Please check GitHub Secrets are configured correctly."
            exit 1
          fi
          
          echo "✅ Using EC2_USER: $EC2_USER"
          echo "✅ Using EC2_HOST: $EC2_HOST"
          
          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          APP_DIR="/var/www/sanhoti"
          BACKEND_DIR="$APP_DIR/backend"
          FRONTEND_DIR="$APP_DIR/frontend"
          
          # Navigate to app directory
          cd "$APP_DIR"
          
          # Preserve uploaded media that is intentionally not tracked in git
          echo "💾 Backing up uploaded media..."
          MEDIA_BACKUP="/tmp/sanhoti-media-backup-$$"
          mkdir -p "$MEDIA_BACKUP"
          [ -d "$APP_DIR/backend/data/Events_Flyers" ]  && cp -r "$APP_DIR/backend/data/Events_Flyers"  "$MEDIA_BACKUP/" || true
          [ -d "$APP_DIR/backend/data/HomePage_Images" ] && cp -r "$APP_DIR/backend/data/HomePage_Images" "$MEDIA_BACKUP/" || true
          [ -d "$APP_DIR/backend/data/DurgaPuja_Page" ] && cp -r "$APP_DIR/backend/data/DurgaPuja_Page" "$MEDIA_BACKUP/" || true
          echo "✅ Media backed up to $MEDIA_BACKUP"

          # Preserve runtime JSON data (bookings, seat maps, ticket setups, users,
          # settings, …). The hard reset below would otherwise overwrite or delete
          # production data with the repo copy — these files are gitignored.
          echo "💾 Backing up runtime data files..."
          DATA_BACKUP="/tmp/sanhoti-data-backup-$$"
          mkdir -p "$DATA_BACKUP"
          cp "$APP_DIR/backend/data/"*.json "$DATA_BACKUP/" 2>/dev/null || true
          echo "✅ Data files backed up to $DATA_BACKUP"

          # Sync to remote (fail deploy if this fails — do not build stale tree)
          echo "📥 Fetching and syncing to origin..."
          git fetch origin
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout -f main
            git reset --hard origin/main
          elif git rev-parse --verify origin/master >/dev/null 2>&1; then
            git checkout -f master
            git reset --hard origin/master
          else
            echo "❌ Neither origin/main nor origin/master exists. Fix git remote on the server."
            exit 1
          fi
          echo "📌 Deployed commit: $(git log -1 --oneline)"

          # Restore uploaded media after hard reset
          echo "♻️  Restoring uploaded media..."
          mkdir -p "$APP_DIR/backend/data/Events_Flyers" "$APP_DIR/backend/data/HomePage_Images" "$APP_DIR/backend/data/DurgaPuja_Page"
          [ -d "$MEDIA_BACKUP/Events_Flyers" ]  && cp -r "$MEDIA_BACKUP/Events_Flyers/."  "$APP_DIR/backend/data/Events_Flyers/"  || true
          [ -d "$MEDIA_BACKUP/HomePage_Images" ] && cp -r "$MEDIA_BACKUP/HomePage_Images/." "$APP_DIR/backend/data/HomePage_Images/" || true
          [ -d "$MEDIA_BACKUP/DurgaPuja_Page" ] && cp -r "$MEDIA_BACKUP/DurgaPuja_Page/." "$APP_DIR/backend/data/DurgaPuja_Page/" || true
          rm -rf "$MEDIA_BACKUP"
          echo "✅ Uploaded media restored"

          # Restore runtime JSON data after the hard reset (prod keeps its own data).
          echo "♻️  Restoring runtime data files..."
          cp "$DATA_BACKUP/"*.json "$APP_DIR/backend/data/" 2>/dev/null || true
          rm -rf "$DATA_BACKUP"
          echo "✅ Runtime data restored"
          
          # Build backend
          echo "🔨 Building backend..."
          cd "$BACKEND_DIR"
          npm ci --production=false
          npm run build
          
          # Build frontend
          echo "🎨 Building frontend..."
          cd "$FRONTEND_DIR"
          npm ci --production=false
          npm run build
          
          # Sanity-check: share UI must be present in bundle (catches stale/cached deploys)
          if ! grep -rq "Share this event" "$FRONTEND_DIR/dist/assets" --include='*.js' 2>/dev/null; then
            echo "❌ Frontend bundle missing share UI — dist may be stale. Aborting."
            exit 1
          fi
          
          # Restart backend with PM2
          echo "🔄 Restarting backend..."
          if pm2 list | grep -q "sanhoti-backend"; then
            pm2 restart sanhoti-backend
          else
            cd "$BACKEND_DIR"
            pm2 start dist/server.js --name sanhoti-backend
            pm2 save
          fi
          
          # Reload Nginx
          echo "🔄 Reloading Nginx..."
          sudo systemctl reload nginx || true
          
          # Check PM2 status
          echo "📊 PM2 Status:"
          pm2 status
          
          echo "✅ Deployment completed successfully!"
          DEPLOY_SCRIPT
          
          chmod +x /tmp/deploy.sh
          
          echo "Copying deployment script to EC2..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 /tmp/deploy.sh "${EC2_USER}@${EC2_HOST}:/tmp/deploy.sh"
          
          echo "Executing deployment script on EC2..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${EC2_USER}@${EC2_HOST}" 'bash /tmp/deploy.sh'
          
          echo "Cleaning up deployment script..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${EC2_USER}@${EC2_HOST}" 'rm -f /tmp/deploy.sh'
          rm -f /tmp/deploy.sh

      - name: Verify deployment
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${EC2_USER}@${EC2_HOST}" << 'VERIFY_SCRIPT'
            echo "Checking backend status..."
            
            # Check if backend is running
            if pm2 list | grep -q "sanhoti-backend.*online"; then
              echo "✅ Backend is running"
            else
              echo "❌ Backend is not running"
              exit 1
            fi
            
            # Check Nginx status
            if sudo systemctl is-active --quiet nginx; then
              echo "✅ Nginx is running"
            else
              echo "⚠️  Nginx check failed (non-critical)"
            fi
            
            echo "✅ Verification completed"
          VERIFY_SCRIPT

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

